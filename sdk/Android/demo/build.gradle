import javax.tools.JavaCompiler

// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: "config.gradle"
buildscript {
    repositories {
        google()
        jcenter()
        maven { url 'https://maven.aliyun.com/repository/public' }
//        maven { url 'https://dl.bintray.com/android/android-tools' }
        maven {url  "https://repos.spark-packages.org"}
        maven{ url 'https://maven.aliyun.com/nexus/content/groups/public/'}
        mavenCentral()
        maven { url 'https://repo.spring.io/libs-release' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.1'

        // for Jenkins autobuild
        classpath group: 'org.tmatesoft.svnkit', name: 'svnkit', version: '1.8.11'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven { url 'https://maven.aliyun.com/repository/public' }
//        maven { url 'https://dl.bintray.com/android/android-tools' }
        maven {url  "https://repos.spark-packages.org"}
        maven{ url 'https://maven.aliyun.com/nexus/content/groups/public/'}
        mavenCentral()
        maven { url 'https://repo.spring.io/libs-release' }
        jcenter()
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompiler){
            options.comilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
